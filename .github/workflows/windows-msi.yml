# .github/workflows/windows-msi.yml
#
# Build HobbyCAD MSI installer using WiX Toolset.
#
# Creates MSI installers for enterprise deployment:
#   - Suitable for Group Policy / SCCM deployment
#   - Per-machine installation to Program Files
#   - Start menu shortcuts and file associations
#   - Clean uninstall via Add/Remove Programs
#
# Both x64 and arm64 architectures are supported. The binaries come from
# the reusable build workflows (windows-build-msvc.yml and
# windows-build-msvc-arm64.yml, native runners); the packaging jobs here
# only stage the runtime DLLs and run WiX, each on its own architecture's
# runner so the matching Visual C++ runtime folder is at hand.

name: Windows MSI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AUTHORS'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:
  # Callable from another workflow (a release workflow that gathers every
  # package on a tag); the triggers above stay as they are.
  workflow_call:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:

  # ================================================================
  #  Build and create x64 MSI
  # ================================================================

  build-x64:
    name: Build (x64)
    uses: ./.github/workflows/windows-build-msvc.yml
    with:
      artifact-name: hobbycad-x64-msi-build

  msi-x64:
    name: HobbyCAD MSI (x64)
    runs-on: windows-latest
    needs: build-x64

    steps:
      - name: Checkout HobbyCAD
        uses: actions/checkout@v7

      - name: Download the x64 build
        uses: actions/download-artifact@v8
        with:
          name: hobbycad-x64-msi-build
          path: staging

      # The runtime DLLs the MSI ships: at least as new as the toolset the build
      # job used, which may have run on a different runner image.
      - name: Select the Visual C++ runtime
        id: msvc
        shell: pwsh
        run: scripts/ci/select-msvc-toolset.ps1 -Arch x64 -MinRuntime "${{ needs.build-x64.outputs.msvc-toolset }}"

      - name: Prepare installation files
        shell: pwsh
        run: |
          $exe = "staging\bin\hobbycad.exe"
          if (-not (Test-Path $exe)) {
              Write-Error "hobbycad.exe not found in the downloaded build"
              exit 1
          }
          Write-Host "x64 build: $exe"
          Write-Host "Size: $([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB"

          # App-local Visual C++ runtime for the MSI (the Inno installer runs vc_redist instead).
          $crt = "${{ steps.msvc.outputs.crt }}"
          if (-not $crt -or -not (Test-Path $crt)) { Write-Error "Visual C++ runtime DLLs not found: '$crt'"; exit 1 }
          New-Item -ItemType Directory -Force -Path staging\crt | Out-Null
          Copy-Item "$crt\*.dll" staging\crt\
          Write-Host "Runtime DLLs from $crt"
          Get-ChildItem staging\crt | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Install WiX Toolset
        # WiX 7 refuses to build until its Open Source Maintenance Fee EULA is
        # accepted (WIX7015). Aaron accepted it for HobbyCAD on 2026-09-15; the
        # fee applies only at US$10,000 annual gross revenue and up. The id
        # changes each major version, and a new one needs his acceptance again.
        run: dotnet tool install --global wix --version 7.0.0

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+([0-9.]+)' |
                     ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not $version) { Write-Host "::warning::version not found in CMakeLists.txt; using the 0.0.0 sentinel"; $version = "0.0.0" }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create WiX source file
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"

          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="HobbyCAD"
                     Manufacturer="HobbyCAD Project"
                     Version="$version"
                     UpgradeCode="E8F5A231-7B3C-4D5E-9F1A-2B3C4D5E6F7A"
                     Scope="perMachine">

              <MajorUpgrade DowngradeErrorMessage="A newer version of HobbyCAD is already installed." />
              <MediaTemplate EmbedCab="yes" />

              <StandardDirectory Id="ProgramFiles6432Folder">
                <Directory Id="INSTALLFOLDER" Name="HobbyCAD">
                  <Directory Id="BinFolder" Name="bin" />
                </Directory>
              </StandardDirectory>

              <StandardDirectory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="HobbyCAD" />
              </StandardDirectory>

              <ComponentGroup Id="ProductComponents" Directory="BinFolder">
                <Component Id="MainExecutable" Guid="A1B2C3D4-E5F6-7890-ABCD-EF1234567890">
                  <File Id="HobbyCADExe" Source="staging\bin\hobbycad.exe" KeyPath="yes">
                    <Shortcut Id="StartMenuShortcut"
                              Directory="ApplicationProgramsFolder"
                              Name="HobbyCAD"
                              WorkingDirectory="BinFolder"
                              Icon="HobbyCADIcon"
                              IconIndex="0"
                              Advertise="yes" />
                  </File>
                  <ProgId Id="HobbyCAD.Project" Description="HobbyCAD Project">
                    <Extension Id="hcad" ContentType="application/x-hobbycad">
                      <Verb Id="open" Command="Open" TargetFile="HobbyCADExe" Argument="&quot;%1&quot;" />
                    </Extension>
                  </ProgId>
                </Component>
                <!-- hobbycad.com: the console-subsystem launcher a bare "hobbycad" resolves to in cmd and PowerShell -->
                <Component Id="ConsoleLauncher" Guid="C3D4E5F6-A7B8-9012-CDEF-123456789012">
                  <File Id="HobbyCADCom" Source="staging\bin\hobbycad.com" KeyPath="yes" />
                </Component>
              </ComponentGroup>

              <!-- App-local Visual C++ runtime: the static-md build links the CRT as DLLs and an MSI has no vc_redist
                   bootstrapper, so Microsoft's redistributable DLLs travel beside hobbycad.exe -->
              <ComponentGroup Id="RuntimeComponents" Directory="BinFolder">
                <Files Include="staging\crt\*.dll" />
              </ComponentGroup>

              <Icon Id="HobbyCADIcon" SourceFile="staging\bin\hobbycad.exe" />

              <!-- Qt 6.4 needs Windows 10 1809 (build 17763); refuse older systems here rather than failing at first launch.
                   Windows Installer reports Windows 8.1 values (VersionNT 603, WindowsBuild 9600) on every later Windows,
                   so the real build number comes from the registry. -->
              <Property Id="WINDOWSBUILDNUMBER" Secure="yes">
                <RegistrySearch Id="WindowsBuildNumber" Root="HKLM" Key="SOFTWARE\Microsoft\Windows NT\CurrentVersion" Name="CurrentBuildNumber" Type="raw" />
              </Property>
              <Launch Condition="Installed OR WINDOWSBUILDNUMBER &gt;= 17763" Message="HobbyCAD requires Windows 10 version 1809 or later." />

              <Feature Id="ProductFeature" Title="HobbyCAD" Level="1">
                <ComponentGroupRef Id="ProductComponents" />
                <ComponentGroupRef Id="RuntimeComponents" />
              </Feature>

            </Package>
          </Wix>
          "@ | Out-File -FilePath "hobbycad.wxs" -Encoding UTF8

      # Without -arch WiX builds a 32-bit package: ProgramFiles6432Folder becomes Program Files (x86)
      - name: Build MSI
        run: wix build -acceptEula wix7 -arch x64 hobbycad.wxs -o HobbyCAD-${{ steps.version.outputs.VERSION }}-x64.msi

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: hobbycad-windows-x64-msi
          path: "*.msi"
          retention-days: 30
          if-no-files-found: error

  # ================================================================
  #  Build and create arm64 MSI (native on ARM64 runner)
  # ================================================================

  build-arm64:
    name: Build (arm64)
    uses: ./.github/workflows/windows-build-msvc-arm64.yml
    with:
      artifact-name: hobbycad-arm64-msi-build

  msi-arm64:
    name: HobbyCAD MSI (arm64)
    runs-on: windows-11-arm
    needs: build-arm64

    steps:
      - name: Checkout HobbyCAD
        uses: actions/checkout@v7

      - name: Download the arm64 build
        uses: actions/download-artifact@v8
        with:
          name: hobbycad-arm64-msi-build
          path: staging

      # The runtime DLLs the MSI ships: at least as new as the toolset the build
      # job used, which may have run on a different runner image.
      - name: Select the Visual C++ runtime
        id: msvc
        shell: pwsh
        run: scripts/ci/select-msvc-toolset.ps1 -Arch arm64 -MinRuntime "${{ needs.build-arm64.outputs.msvc-toolset }}"

      - name: Prepare installation files
        shell: pwsh
        run: |
          $exe = "staging\bin\hobbycad.exe"
          if (-not (Test-Path $exe)) {
              Write-Error "hobbycad.exe not found in the downloaded build"
              exit 1
          }
          Write-Host "arm64 build: $exe"
          Write-Host "Size: $([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB"

          # App-local Visual C++ runtime for the MSI (the Inno installer runs vc_redist instead).
          $crt = "${{ steps.msvc.outputs.crt }}"
          if (-not $crt -or -not (Test-Path $crt)) { Write-Error "Visual C++ runtime DLLs not found: '$crt'"; exit 1 }
          New-Item -ItemType Directory -Force -Path staging\crt | Out-Null
          Copy-Item "$crt\*.dll" staging\crt\
          Write-Host "Runtime DLLs from $crt"
          Get-ChildItem staging\crt | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Install WiX Toolset
        # WiX 7 refuses to build until its Open Source Maintenance Fee EULA is
        # accepted (WIX7015). Aaron accepted it for HobbyCAD on 2026-09-15; the
        # fee applies only at US$10,000 annual gross revenue and up. The id
        # changes each major version, and a new one needs his acceptance again.
        run: dotnet tool install --global wix --version 7.0.0

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+([0-9.]+)' |
                     ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not $version) { Write-Host "::warning::version not found in CMakeLists.txt; using the 0.0.0 sentinel"; $version = "0.0.0" }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create WiX source file
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"

          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="HobbyCAD"
                     Manufacturer="HobbyCAD Project"
                     Version="$version"
                     UpgradeCode="E8F5A231-7B3C-4D5E-9F1A-2B3C4D5E6F7B"
                     Scope="perMachine">

              <MajorUpgrade DowngradeErrorMessage="A newer version of HobbyCAD is already installed." />
              <MediaTemplate EmbedCab="yes" />

              <StandardDirectory Id="ProgramFiles6432Folder">
                <Directory Id="INSTALLFOLDER" Name="HobbyCAD">
                  <Directory Id="BinFolder" Name="bin" />
                </Directory>
              </StandardDirectory>

              <StandardDirectory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="HobbyCAD" />
              </StandardDirectory>

              <ComponentGroup Id="ProductComponents" Directory="BinFolder">
                <Component Id="MainExecutable" Guid="B2C3D4E5-F6A7-8901-BCDE-F12345678901">
                  <File Id="HobbyCADExe" Source="staging\bin\hobbycad.exe" KeyPath="yes">
                    <Shortcut Id="StartMenuShortcut"
                              Directory="ApplicationProgramsFolder"
                              Name="HobbyCAD"
                              WorkingDirectory="BinFolder"
                              Icon="HobbyCADIcon"
                              IconIndex="0"
                              Advertise="yes" />
                  </File>
                  <ProgId Id="HobbyCAD.Project" Description="HobbyCAD Project">
                    <Extension Id="hcad" ContentType="application/x-hobbycad">
                      <Verb Id="open" Command="Open" TargetFile="HobbyCADExe" Argument="&quot;%1&quot;" />
                    </Extension>
                  </ProgId>
                </Component>
                <!-- hobbycad.com: the console-subsystem launcher a bare "hobbycad" resolves to in cmd and PowerShell -->
                <Component Id="ConsoleLauncher" Guid="D4E5F6A7-B8C9-0123-DEF1-234567890123">
                  <File Id="HobbyCADCom" Source="staging\bin\hobbycad.com" KeyPath="yes" />
                </Component>
              </ComponentGroup>

              <!-- App-local Visual C++ runtime: the static-md build links the CRT as DLLs and an MSI has no vc_redist
                   bootstrapper, so Microsoft's redistributable DLLs travel beside hobbycad.exe -->
              <ComponentGroup Id="RuntimeComponents" Directory="BinFolder">
                <Files Include="staging\crt\*.dll" />
              </ComponentGroup>

              <Icon Id="HobbyCADIcon" SourceFile="staging\bin\hobbycad.exe" />

              <!-- Qt 6.4 needs Windows 10 1809 (build 17763); refuse older systems here rather than failing at first launch.
                   Windows Installer reports Windows 8.1 values (VersionNT 603, WindowsBuild 9600) on every later Windows,
                   so the real build number comes from the registry. -->
              <Property Id="WINDOWSBUILDNUMBER" Secure="yes">
                <RegistrySearch Id="WindowsBuildNumber" Root="HKLM" Key="SOFTWARE\Microsoft\Windows NT\CurrentVersion" Name="CurrentBuildNumber" Type="raw" />
              </Property>
              <Launch Condition="Installed OR WINDOWSBUILDNUMBER &gt;= 17763" Message="HobbyCAD requires Windows 10 version 1809 or later." />

              <Feature Id="ProductFeature" Title="HobbyCAD" Level="1">
                <ComponentGroupRef Id="ProductComponents" />
                <ComponentGroupRef Id="RuntimeComponents" />
              </Feature>

            </Package>
          </Wix>
          "@ | Out-File -FilePath "hobbycad.wxs" -Encoding UTF8

      - name: Build MSI
        run: wix build -acceptEula wix7 -arch arm64 hobbycad.wxs -o HobbyCAD-${{ steps.version.outputs.VERSION }}-arm64.msi

      - name: Upload MSI
        uses: actions/upload-artifact@v7
