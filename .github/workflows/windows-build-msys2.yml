# .github/workflows/windows-build-msys2.yml
#
# Build HobbyCAD on Windows x64 using MSYS2 UCRT64 with GCC and
# pacman packages.  This matches the local developer setup from
# tools/windows/setup-env.ps1 (GCC, Ninja, pacman).
#
# All dependencies come from pre-built pacman packages (fast).

name: Windows Build (MSYS2)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AUTHORS'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:

  msys2:
    name: HobbyCAD via MSYS2 (x64)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Disable autocrlf
        run: git config --global core.autocrlf input
        shell: bash

      - name: Checkout HobbyCAD
        uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-opencascade
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-libgit2
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-eigen3
            mingw-w64-ucrt-x86_64-nlohmann-json
            git
            patch

      # libslvs is not available as an MSYS2 package - build from PPA source
      - name: Build libslvs from source
        shell: msys2 {0}
        run: |
          # The pinned orig tarball (versions.json), checksum-verified. The
          # HobbyCAD series is baked into it, so there is nothing to patch.
          scripts/ci/fetch.sh libslvs /tmp/solvespace
          cd /tmp/solvespace

          # Stub empty submodule directories
          for submod in zlib libpng freetype cairo pixman angle; do
            mkdir -p extlib/$submod
            echo "# stub" > extlib/$submod/CMakeLists.txt
          done

          # Populate Eigen headers from MSYS2 system package
          mkdir -p extlib/eigen
          cp -r /ucrt64/include/eigen3/. extlib/eigen/

          # Override solvespace's set(CMAKE_CXX_STANDARD 11); the -D flag cannot
          # override a normal variable, so we must patch the source directly
          sed -i 's/set(CMAKE_CXX_STANDARD 11)/set(CMAKE_CXX_STANDARD 14)/' CMakeLists.txt

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64 \
            -DBUILD_LIB=ON \
            -DENABLE_GUI=OFF \
            -DENABLE_CLI=OFF \
            -DENABLE_OPENMP=OFF \
            -DENABLE_TESTS=OFF
          cmake --build build

          # Install libslvs to MSYS2 prefix
          # Ninja places binaries under build/bin/
          cp build/bin/libslvs.dll.a /ucrt64/lib/
          cp build/bin/libslvs.dll /ucrt64/bin/
          mkdir -p /ucrt64/include/slvs
          cp include/slvs.h /ucrt64/include/slvs/

          # Create pkg-config file so CMake can find libslvs
          mkdir -p /ucrt64/lib/pkgconfig
          printf '%s\n' \
            'prefix=/ucrt64' \
            'exec_prefix=${prefix}' \
            'libdir=${prefix}/lib' \
            'includedir=${prefix}/include' \
            '' \
            'Name: libslvs' \
            'Description: SolveSpace constraint solver library' \
            'Version: 3.2' \
            'Libs: -L${libdir} -lslvs' \
            'Cflags: -I${includedir}/slvs' \
            > /ucrt64/lib/pkgconfig/libslvs.pc

      - name: Configure CMake
        run: cmake --preset msys2-release

      - name: Build
        run: cmake --build --preset msys2-release

      - name: Package build
        run: |
          cmake --install build --prefix build/install

          # Copy runtime DLLs from UCRT64
          BINDIR="build/install/bin"
          if [ -f "$BINDIR/hobbycad.exe" ]; then
              # ntldd prints Windows paths (C:\tools\msys64\ucrt64\bin\Qt6Core.dll),
              # so match the backslash form and convert with cygpath before
              # copying. A zero count is an error: the artifact would not run.
              copied=0
              while read -r dll; do
                  cp -n "$(cygpath -u "$dll")" "$BINDIR/" && copied=$((copied + 1))
              done < <(ntldd -R "$BINDIR/hobbycad.exe" 2>/dev/null | grep -io '[a-z]:\\[^ ]*\\ucrt64\\bin\\[^ ]*\.dll' | sort -u)
              echo "runtime DLLs copied: $copied"
              if [ "$copied" -eq 0 ]; then echo '::error::no UCRT64 runtime DLLs found by ntldd'; exit 1; fi

              # Qt plugins: copy all runtime-needed plugin directories
              QT_PLUGIN_DIR="/ucrt64/share/qt6/plugins"
              for plugin_dir in platforms imageformats iconengines styles tls; do
                  if [ -d "$QT_PLUGIN_DIR/$plugin_dir" ]; then
                      mkdir -p "$BINDIR/$plugin_dir"
                      cp "$QT_PLUGIN_DIR/$plugin_dir"/*.dll \
                          "$BINDIR/$plugin_dir/" 2>/dev/null || true
                  fi
              done
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hobbycad-windows-x64-msys2
          path: build/install/
          retention-days: 30
          if-no-files-found: error
