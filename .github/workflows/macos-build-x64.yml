# .github/workflows/macos-build-x64.yml
#
# Build HobbyCAD on macOS x86_64 (Intel) using vcpkg with static
# linking.  All third-party dependencies are statically linked.
#
# Separated from the arm64 workflow because x86_64 runs on the self-hosted
# Intel Mac mini (MacMini2018-hobbycad, macOS 15.1): GitHub retired the
# free x86_64 macOS runner and the paid macos-13-large was often
# unavailable. The repository is public, so the job is gated on the
# repository owner; fork pull requests never reach the machine. The mini
# keeps ~/vcpkg and its binary cache between runs, so the steps below are
# written to be repeatable rather than to assume a fresh runner.

name: macOS Build x64

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AUTHORS'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:
  # Callable from another workflow (a release workflow that gathers every
  # package on a tag); the triggers above stay as they are.
  workflow_call:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:

  macos-x64:
    name: HobbyCAD macOS (x86_64)
    runs-on: [self-hosted, macOS, X64]
    if: github.actor == 'ayourk'
    concurrency:
      group: mac-mini-build-x64
      cancel-in-progress: true
    timeout-minutes: 180

    env:
      BUILD_TYPE: Release
      VCPKG_DEFAULT_TRIPLET: x64-osx-static
      # The mini's own archive cache, which persists between runs.
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"

    steps:
      - name: Checkout HobbyCAD
        uses: actions/checkout@v7

      - name: Install build tools
        run: brew list --formula ninja >/dev/null 2>&1 || brew install ninja

      - name: Setup vcpkg
        run: |
          # Repeatable: the mini keeps ~/vcpkg; a fresh machine clones it.
          if [ -d ~/vcpkg/.git ]; then
            git -C ~/vcpkg fetch --quiet --tags origin
            git -C ~/vcpkg checkout --quiet 2026.02.27
          else
            git clone --branch 2026.02.27 https://github.com/microsoft/vcpkg.git ~/vcpkg
          fi
          ~/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
          echo "$HOME/vcpkg" >> $GITHUB_PATH

      - name: Clear vcpkg registry cache
        run: rm -rf ~/.cache/vcpkg/registries

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install --triplet x64-osx-static \
            --overlay-triplets=${{ github.workspace }}/vcpkg-custom-triplets \
            --x-install-root=vcpkg_installed \
            --clean-buildtrees-after-build

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-osx-static \
            -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/vcpkg-custom-triplets \
            -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package build
        run: |
          cmake --install build --prefix build/install

          # On macOS the target is an app bundle, installed at the prefix
          # root as HobbyCAD.app (static build: one executable inside it,
          # no dylibs to bundle). The bare bin/hobbycad form is kept as a
          # fallback for a non-bundle configuration.
          exe="build/install/HobbyCAD.app/Contents/MacOS/HobbyCAD"
          [ -f "$exe" ] || exe="build/install/bin/hobbycad"
          if [ ! -f "$exe" ]; then
            echo "::error::hobbycad not found in build/install (neither HobbyCAD.app nor bin/)"
            exit 1
          fi
          if [ -f build/install/HobbyCAD.app/Contents/Resources/hobbycad.icns ]; then
            echo "Bundle icon: hobbycad.icns present"
          else
            echo "::warning::HobbyCAD.app has no hobbycad.icns"
          fi
          echo "Static build produced: $exe"
          echo "Size: $(du -h "$exe" | cut -f1)"
          echo "Architecture: $(file "$exe")"

      - name: Create DMG
        # make-dmg.sh asks Finder for the window layout through AppleScript.
        # The first run from the runner service raises macOS's Automation
        # prompt on the mini's screen; allow it once, or the layout is
        # skipped and the DMG is still produced.
        run: tools/macos/make-dmg.sh build/install/HobbyCAD.app x86_64 dist

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: hobbycad-macos-x86_64-dmg
          path: dist/*.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hobbycad-macos-x64
          path: build/install/
          retention-days: 30
          if-no-files-found: error
