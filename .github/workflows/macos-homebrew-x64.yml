# .github/workflows/macos-homebrew-x64.yml
#
# Test HobbyCAD Homebrew formula installation on macOS x86_64 (Intel).
#
# Separated from the main macOS Homebrew workflow because x86_64 runs
# on the self-hosted Intel Mac mini (MacMini2018-hobbycad, macOS 15.1),
# not on a GitHub-hosted runner: GitHub retired the free x86_64 macOS
# runner and the paid macos-13-large was often unavailable. The
# repository is public, so every job that names the self-hosted runner
# is gated on the repository owner; fork pull requests never reach it.

name: macOS Homebrew x64

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AUTHORS'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:

  # ================================================================
  #  Homebrew Formula Test — x86_64
  # ================================================================
  #
  #  Runs on the self-hosted Intel Mac mini. One runner, so overlapping
  #  pushes cancel the older run instead of queueing behind it.

  homebrew-x64:
    name: HobbyCAD Homebrew (x86_64)
    runs-on: [self-hosted, macOS, X64]
    if: github.actor == 'ayourk'
    concurrency:
      group: mac-mini-homebrew-x64
      cancel-in-progress: true

    steps:
      - name: Checkout HobbyCAD
        uses: actions/checkout@v7

      - name: Set up Homebrew
        run: |
          # Ensure Homebrew is up to date
          brew update

      - name: Use the runner's prebuilt Qt 6.4.2 when present
        id: qt
        run: |
          # The Mac mini keeps the aqtinstall Qt at ~/Qt/6.4.2/macos, the same
          # route tools/macos/setup-env.sh documents. Use it and skip the
          # download below; any other runner falls through to the action.
          if [ -x "$HOME/Qt/6.4.2/macos/bin/qmake" ]; then
            echo "QT_ROOT_DIR=$HOME/Qt/6.4.2/macos" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $HOME/Qt/6.4.2/macos"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt 6.4.2 (prebuilt)
        # The project pins Qt 6.4.2. Homebrew's qt is rolling (6.11 today) and
        # has no Intel macOS bottle at all, so on x86_64 "brew install qt"
        # compiles Qt for hours. The prebuilt 6.4.2 (the same route
        # tools/macos/setup-env.sh documents) is one universal binary for
        # arm64 and x86_64.
        if: steps.qt.outputs.found != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.2'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Tap HobbyCAD repository
        run: |
          brew tap ayourk/hobbycad

      - name: Install HobbyCAD dependencies
        run: |
          # Install dependencies from tap (keg-only, pinned versions)
          brew install ayourk/hobbycad/opencascade@8.0.1
          brew install ayourk/hobbycad/libzip@1.7.3
          brew install ayourk/hobbycad/libgit2@1.9.2
          brew install ayourk/hobbycad/libslvs
          brew install ayourk/hobbycad/lib3mf
          brew install ayourk/hobbycad/openmesh
          brew install ayourk/hobbycad/meshfix

          # Install standard dependencies. nlohmann-json is required by
          # libhobbycad; the icons are rendered by the build itself, so no
          # librsvg.
          brew install ninja nlohmann-json

      - name: Set CMAKE_PREFIX_PATH
        run: |
          OCCT_PFX=$(brew --prefix ayourk/hobbycad/opencascade@8.0.1)
          LZIP_PFX=$(brew --prefix ayourk/hobbycad/libzip@1.7.3)
          LGIT_PFX=$(brew --prefix ayourk/hobbycad/libgit2@1.9.2)
          SLVS_PFX=$(brew --prefix ayourk/hobbycad/libslvs)
          L3MF_PFX=$(brew --prefix ayourk/hobbycad/lib3mf)
          OMSH_PFX=$(brew --prefix ayourk/hobbycad/openmesh)
          MFIX_PFX=$(brew --prefix ayourk/hobbycad/meshfix)
          QT6_PFX="${QT_ROOT_DIR}"

          PREFIX_PATH="${OCCT_PFX}:${LZIP_PFX}:${LGIT_PFX}:${SLVS_PFX}:${L3MF_PFX}:${OMSH_PFX}:${MFIX_PFX}:${QT6_PFX}"
          echo "CMAKE_PREFIX_PATH=${PREFIX_PATH}" >> "$GITHUB_ENV"

      - name: Build HobbyCAD
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install

          cmake --build build
          cmake --install build

      - name: Create Homebrew-style package
        run: |
          # Create a tarball similar to what Homebrew would install
          cd install
          tar -czvf ../hobbycad-homebrew-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hobbycad-homebrew-x64
          path: "*.tar.gz"
          retention-days: 30
          if-no-files-found: error
