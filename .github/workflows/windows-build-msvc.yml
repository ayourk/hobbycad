# .github/workflows/windows-build-msvc.yml
#
# Build HobbyCAD on Windows x64 using MSVC with vcpkg manifest mode.
#
# Tests MSVC/cl.exe compatibility using the pinned versions in
# vcpkg.json + vcpkg-configuration.json.
#
# First build is slow (~30 min) due to Qt6/OCCT compilation.
# Later builds restore vcpkg's binary archives from the GitHub Actions
# cache (see "Restore vcpkg binary cache"), so only changed packages build.
#
# Also a reusable workflow: the Installer and MSI workflows call it and
# package the install tree it uploads.

name: Windows Build (MSVC x64)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AUTHORS'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:
  # Called by windows-inno.yml and windows-msi.yml, which package this
  # build instead of compiling their own copy of it.
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the uploaded install tree
        type: string
        required: false
        default: hobbycad-windows-x64-msvc
    outputs:
      msvc-toolset:
        description: The MSVC toolset the build used; a job packaging its runtime DLLs needs one at least this new.
        value: ${{ jobs.msvc-x64.outputs.msvc-toolset }}

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:

  msvc-x64:
    name: HobbyCAD via MSVC (x64)
    outputs:
      msvc-toolset: ${{ steps.msvc.outputs.toolset }}
    runs-on: windows-latest

    env:
      BUILD_TYPE: Release
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"

    steps:
      - name: Checkout HobbyCAD
        uses: actions/checkout@v7

      - name: Free disk space
        shell: pwsh
        run: |
          # Remove large pre-installed components to free disk for vcpkg builds
          $dirs = @(
            "C:\Android",
            "C:\Program Files\dotnet\sdk",
            "C:\Program Files\dotnet\shared",
            "C:\Program Files\LLVM",
            "C:\Program Files (x86)\Microsoft SDKs\Azure",
            "C:\Program Files\MongoDB",
            "C:\Program Files\PostgreSQL"
          )
          foreach ($d in $dirs) {
            if (Test-Path $d) {
              Write-Host "Removing $d ..."
              Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue
            }
          }
          # Show available space
          Get-PSDrive C | Select-Object Used,Free | Format-Table -AutoSize

      - name: Setup vcpkg
        run: |
          # Clone the exact baseline version to ensure version overrides work
          if (Test-Path "C:\vcpkg") {
              Remove-Item -Recurse -Force C:\vcpkg
          }
          git clone --branch 2026.02.27 https://github.com/microsoft/vcpkg.git C:\vcpkg
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "C:\vcpkg" >> $env:GITHUB_PATH

      # MSVC 14.44 (Visual Studio 2022, v143) for as long as the runner image
      # carries it, otherwise the newest toolset and its runtime, with a warning
      # (Aaron, 2026-09-15). vcpkg ignores the developer environment and picks
      # its own toolset, so the script also pins it in a copy of the triplets.
      - name: Select MSVC toolset
        id: msvc
        shell: pwsh
        run: scripts/ci/select-msvc-toolset.ps1 -Arch x64 -TripletSource vcpkg-custom-triplets -TripletOut "$env:RUNNER_TEMP\vcpkg-triplets"

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ steps.msvc.outputs.toolset }}
          vsversion: ${{ steps.msvc.outputs.vsversion }}

      - name: Clear vcpkg registry cache
        run: |
          $cachePath = "$env:LOCALAPPDATA\vcpkg\registries"
          if (Test-Path $cachePath) {
            Remove-Item -Recurse -Force $cachePath
            Write-Host "Cleared vcpkg registry cache"
          }

      # vcpkg stores every package it builds as an archive in vcpkg-bincache
      # (the files provider in VCPKG_BINARY_SOURCES), and that directory is kept
      # in the GitHub Actions cache. vcpkg hashes each package's inputs itself,
      # so restoring an older cache is safe: unchanged packages come from it and
      # only changed ones build. The runner image is in the key because an image
      # update can change the compiler and with it those hashes.
      - name: vcpkg binary cache key
        id: vcpkg-key
        run: |
          New-Item -ItemType Directory -Force -Path vcpkg-bincache | Out-Null
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-bincache
          key: vcpkg-x64-windows-static-md-2026.02.27-${{ steps.vcpkg-key.outputs.image }}-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-custom-triplets/**') }}
          restore-keys: vcpkg-x64-windows-static-md-2026.02.27-

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install --triplet x64-windows-static-md `
            --overlay-triplets="${{ steps.msvc.outputs.triplets }}" `
            --x-install-root=vcpkg_installed `
            --clean-buildtrees-after-build

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DVCPKG_OVERLAY_TRIPLETS="${{ steps.msvc.outputs.triplets }}" `
            -DVCPKG_INSTALLED_DIR=${{ github.workspace }}\vcpkg_installed

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package build
        shell: pwsh
        run: |
          $installDir = "build\install"
          cmake --install build --prefix $installDir

          # Static build: all dependencies linked into the executable.
          # No DLLs or Qt plugins to copy.
          $exe = "$installDir\bin\hobbycad.exe"
          if (-not (Test-Path $exe)) {
              Write-Error "hobbycad.exe not found at $exe"
              exit 1
          }
          Write-Host "Static build produced: $exe"
          Write-Host "Size: $([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name || 'hobbycad-windows-x64-msvc' }}
          path: build/install/
          retention-days: 30
          if-no-files-found: error

      - name: Portable zip
        shell: pwsh
        run: |
          # A run-anywhere tree for people who want no installer: the install
          # tree plus the Visual C++ runtime DLLs beside the program, the only
          # dynamic dependency the static-md build has.
          $version = Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+([0-9.]+)' |
                     Select-Object -First 1 | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not $version) { Write-Host "::warning::version not found in CMakeLists.txt; using the 0.0.0 sentinel"; $version = "0.0.0" }
          $name = "HobbyCAD-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path "zip\$name" | Out-Null
          Copy-Item -Recurse build\install\* "zip\$name\"
          Copy-Item LICENSE "zip\$name\LICENSE.txt"
          $crt = "${{ steps.msvc.outputs.crt }}"
          if (-not $crt -or -not (Test-Path $crt)) { Write-Error "Visual C++ runtime DLLs not found: '$crt'"; exit 1 }
          Copy-Item "$crt\*.dll" "zip\$name\bin\"
          Compress-Archive -Path "zip\$name" -DestinationPath "$name.zip" -CompressionLevel Optimal
          Write-Host "$name.zip $([math]::Round((Get-Item "$name.zip").Length / 1MB, 1)) MB, runtime DLLs from $crt"
          echo "ZIP_NAME=$name.zip" >> $env:GITHUB_ENV

      - name: Upload portable zip
        uses: actions/upload-artifact@v7
        with:
          # Follows the caller's artifact name, so a run that calls this build
          # more than once (Installer and MSI) uploads distinct zips.
          name: ${{ inputs.artifact-name && format('{0}-zip', inputs.artifact-name) || 'hobbycad-windows-x64-zip' }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
          if-no-files-found: error
