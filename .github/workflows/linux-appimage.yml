# .github/workflows/linux-appimage.yml
#
# Build HobbyCAD AppImage for x86_64 and arm64.
#
# AppImages are built on Ubuntu 22.04 (glibc 2.35) for maximum compatibility.
# The resulting AppImages run on most Linux distros from 2022 onward:
# Ubuntu 22.04+, Fedora 36+, Debian 12+, Arch, openSUSE Tumbleweed, etc.
#
# AppImage bundles all dependencies (Qt6, OCCT, etc.) into a single
# portable executable that requires no installation.
#
# Note: AppImages are intentionally built only on Ubuntu 22.04 (not 24.04)
# because the older glibc provides broader compatibility. Users wanting
# the latest libraries should use native packages (.deb, .rpm) instead.

name: Linux AppImage

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AUTHORS'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:
  # Callable from another workflow (a release workflow that gathers every
  # package on a tag); the triggers above stay as they are.
  workflow_call:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:

  # ================================================================
  #  AppImage Matrix Build
  # ================================================================
  #
  #  Builds portable AppImages using linuxdeploy and the Qt plugin.
  #  Each AppImage includes Qt6, OCCT, and all required libraries.

  appimage:
    name: HobbyCAD AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Built in an ubuntu:22.04 container, so the AppImage is made with
    # jammy's own CMake 3.22 and GCC 11 rather than the hosted runner's newer
    # CMake. A container has no FUSE: linuxdeploy extracts itself instead.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: 1

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            linuxdeploy_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            linuxdeploy_arch: aarch64

    steps:
      # A bare image has none of what the hosted runner provides; sudo lets
      # the steps below run unchanged as root.
      - name: Prepare the container
        run: |
          apt-get update
          apt-get install -y git sudo ca-certificates curl wget gnupg software-properties-common tzdata

      - name: Checkout HobbyCAD
        uses: actions/checkout@v7

      - name: Add HobbyCAD PPA
        run: |
          sudo add-apt-repository -y ppa:ayourk/hobbycad
          echo 'Package: *
          Pin: release o=LP-PPA-ayourk-hobbycad
          Pin-Priority: 1001' | sudo tee /etc/apt/preferences.d/hobbycad-ppa
          sudo apt-get update

      # Remove stock Qt 6.2 packages that conflict with PPA's Qt 6.4.2
      # The build dependencies are debian/control's Build-Depends (the PPA
      # supplies Qt 6.4.2, libslvs and nlohmann-json 3.12.0). The extras are
      # the Qt image plugins the AppImage bundles and what linuxdeploy needs.
      - name: Install dependencies
        run: scripts/ci/install-build-deps.sh deb --extra qt6-image-formats-plugins libfuse2 file
        # MeshFix is not used by HobbyCAD today (devtest only; planned for
        # HobbyMesh). Kept commented out, not removed; the PPA carries it:
        # run: scripts/ci/install-build-deps.sh deb --extra qt6-image-formats-plugins libfuse2 file libmeshfix-dev

      - name: Configure CMake
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release

      - name: Install to AppDir
        run: |
          cmake --install build --prefix AppDir/usr

      - name: Download linuxdeploy tools
        run: |
          # Download linuxdeploy for this architecture
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage
          chmod +x linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage

          # Download Qt plugin for linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.linuxdeploy_arch }}.AppImage
          chmod +x linuxdeploy-plugin-qt-${{ matrix.linuxdeploy_arch }}.AppImage

      - name: Create AppImage
        env:
          QMAKE: /usr/bin/qmake6
          QT_SELECT: qt6
        run: |
          # Create desktop file if not already installed
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/hobbycad.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=HobbyCAD
          Comment=Parametric 3D CAD Application
          Exec=hobbycad
          Icon=hobbycad
          Categories=Graphics;3DGraphics;Engineering;
          Terminal=false
          StartupNotify=true
          MimeType=application/x-hobbycad;
          EOF

          # Ensure icon exists
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          if [ -f AppDir/usr/share/icons/hicolor/256x256/apps/hobbycad.png ]; then
            cp AppDir/usr/share/icons/hicolor/256x256/apps/hobbycad.png AppDir/
          elif [ -f build/icons/hobbycad-256.png ]; then
            # Rendered by the build itself (tools/render-icons.cpp)
            cp build/icons/hobbycad-256.png AppDir/hobbycad.png
          fi

          # Run linuxdeploy with Qt plugin
          ./linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/hobbycad.desktop

          # Rename to standard format (skip if already named correctly)
          for f in HobbyCAD*.AppImage; do
            target="HobbyCAD-${{ matrix.arch }}.AppImage"
            [ "$f" != "$target" ] && mv "$f" "$target" || true
          done

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: hobbycad-linux-${{ matrix.arch }}-appimage
          path: HobbyCAD-${{ matrix.arch }}.AppImage
          retention-days: 30
          if-no-files-found: error
