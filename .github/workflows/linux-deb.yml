# .github/workflows/linux-deb.yml
#
# Build HobbyCAD DEB packages for Debian and Ubuntu.
#
# Builds native .deb packages for:
#   - Ubuntu 22.04 (Jammy) - LTS until 2027
#   - Ubuntu 24.04 (Noble) - LTS until 2029
#   - Debian 12 (Bookworm) - stable, matches Ubuntu 22.04 era
#
# Both x86_64 (amd64) and aarch64 (arm64) architectures are supported.

name: Linux DEB

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AUTHORS'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:
  # Callable from another workflow (a release workflow that gathers every
  # package on a tag); the triggers above stay as they are.
  workflow_call:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:

  # ================================================================
  #  DEB Build Matrix
  # ================================================================
  #
  #  Builds .deb packages using native containers or runners.
  #  Debian 12 uses containers; Ubuntu uses native runners.

  deb:
    name: HobbyCAD DEB (${{ matrix.distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      DEBIAN_FRONTEND: noninteractive

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 in an ubuntu:22.04 container: the hosted runner's
          # newer CMake in /usr/local would hide jammy's own CMake 3.22 and
          # GCC 11, which Launchpad builds with and which HobbyCAD supports.
          - distro: ubuntu2204
            distro_name: jammy
            arch: amd64
            runner: ubuntu-24.04
            container: ubuntu:22.04
            artifact_name: hobbycad-ubuntu2204-amd64
          - distro: ubuntu2204
            distro_name: jammy
            arch: arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:22.04
            artifact_name: hobbycad-ubuntu2204-arm64
          # Ubuntu 24.04 (native runners)
          - distro: ubuntu2404
            distro_name: noble
            arch: amd64
            runner: ubuntu-24.04
            container: ""
            artifact_name: hobbycad-ubuntu2404-amd64
          - distro: ubuntu2404
            distro_name: noble
            arch: arm64
            runner: ubuntu-24.04-arm
            container: ""
            artifact_name: hobbycad-ubuntu2404-arm64
          # Debian 12 (containers)
          - distro: debian12
            distro_name: bookworm
            arch: amd64
            runner: ubuntu-24.04
            container: debian:12
            artifact_name: hobbycad-debian12-amd64
          - distro: debian12
            distro_name: bookworm
            arch: arm64
            runner: ubuntu-24.04-arm
            container: debian:12
            artifact_name: hobbycad-debian12-arm64

    steps:
      # A bare image has none of what the hosted runner provides; sudo lets
      # the steps below run unchanged as root.
      - name: Prepare the container
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y git sudo ca-certificates curl gnupg software-properties-common tzdata

      - name: Checkout HobbyCAD
        uses: actions/checkout@v7

      - name: Add the HobbyCAD PPA (Ubuntu)
        if: startsWith(matrix.distro, 'ubuntu')
        run: |
          sudo add-apt-repository -y ppa:ayourk/hobbycad
          echo 'Package: *
          Pin: release o=LP-PPA-ayourk-hobbycad
          Pin-Priority: 1001' | sudo tee /etc/apt/preferences.d/hobbycad-ppa
          sudo apt-get update

      # The build dependencies are debian/control's Build-Depends. On Ubuntu
      # the PPA supplies all of them, Qt 6.4.2 on 22.04, libslvs-dev and
      # nlohmann-json3-dev (>= 3.12.0) included.
      - name: Install build dependencies (Ubuntu)
        if: startsWith(matrix.distro, 'ubuntu')
        run: scripts/ci/install-build-deps.sh deb --extra curl xz-utils
        # With MeshFix again (see the commented Debian step below), the PPA
        # carries it for jammy and noble:
        # run: scripts/ci/install-build-deps.sh deb --extra curl xz-utils libmeshfix-dev

      # Debian has no libslvs and an older nlohmann-json, so the container
      # job builds those two from the versions.json pins and installs the
      # rest of debian/control's Build-Depends.
      - name: Install build dependencies (Debian)
        if: startsWith(matrix.distro, 'debian')
        run: scripts/ci/install-build-deps.sh deb --provided libslvs-dev,nlohmann-json3-dev --extra libeigen3-dev curl xz-utils ca-certificates

      - name: Build pinned dependencies (Debian)
        if: startsWith(matrix.distro, 'debian')
        run: |
          scripts/ci/build-nlohmann-json.sh
          scripts/ci/build-libslvs.sh --static

      # MeshFix is not built: nothing in the package uses it (devtest only
      # probes for it), and it is the planned auto-repair backend for
      # HobbyMesh (docs/cad_library_recommendations.txt, section 14). Kept
      # commented out, not removed. Before enabling it again: pin its orig in
      # versions.json and fetch it through scripts/ci (Launchpad +sourcefiles
      # URLs disappear), carry the shared-library patch in the orig, and fix
      # the two loader memory-safety defects (MarcoAttene/MeshFix-V2.1 issue
      # #19). Debian has no MeshFix package, so its legs build it.
      # - name: Build meshfix from source (Debian)
      #   if: startsWith(matrix.distro, 'debian')
      #   run: |
      #     curl -fL --retry 3 --retry-all-errors -o /tmp/meshfix.tar.gz "https://launchpad.net/~ayourk/+archive/ubuntu/hobbycad/+sourcefiles/meshfix/2.1.git~20260208-1~ppa1~noble1/meshfix_2.1.git~20260208.orig.tar.gz"
      #     mkdir -p /tmp/meshfix && tar -xzf /tmp/meshfix.tar.gz -C /tmp/meshfix --strip-components=1
      #     curl -fL --retry 3 --retry-all-errors -o /tmp/meshfix.debian.tar.xz "https://launchpad.net/~ayourk/+archive/ubuntu/hobbycad/+sourcefiles/meshfix/2.1.git~20260208-1~ppa1~noble1/meshfix_2.1.git~20260208-1~ppa1~noble1.debian.tar.xz"
      #     tar -xJf /tmp/meshfix.debian.tar.xz -C /tmp/meshfix
      #     cd /tmp/meshfix && patch -p1 < debian/patches/0001-build-shared-library.patch
      #     cmake -B build -G Ninja \
      #       -DCMAKE_BUILD_TYPE=Release \
      #       -DMESHFIX_BUILD_SHARED=ON \
      #       -DMESHFIX_BUILD_CLI=OFF
      #     cmake --build build
      #     cmake --install build
      #     # /usr/local/lib is not in the loader cache until ldconfig runs;
      #     # the package build runs the test suites against this library.
      #     ldconfig

      - name: Build the packages with the repository's debian/ directory
        run: |
          # debian/ is the authoritative packaging: it produces hobbycad and
          # libhobbycad-dev and takes the runtime dependencies (the OCCT 8.0
          # libraries among them) from shlibs instead of a hand-written list.
          # The Debian legs built libslvs and nlohmann-json from source above,
          # so the build-dependency check is skipped there.
          SKIP_DEPS=""
          case "${{ matrix.distro }}" in debian*) SKIP_DEPS="-d" ;; esac
          dpkg-buildpackage -us -uc -b $SKIP_DEPS
          mkdir -p artifacts
          mv ../*.deb artifacts/
          ls -la artifacts

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-deb
          path: "artifacts/*.deb"
          retention-days: 30
          if-no-files-found: error
