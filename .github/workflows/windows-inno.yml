# .github/workflows/windows-inno.yml
#
# Build HobbyCAD installer using Inno Setup.
#
# The two binaries come from the reusable build workflows
# (windows-build-msvc.yml, windows-build-msvc-arm64.yml); this workflow
# only stages the extras and runs Inno Setup.
#
# Creates a unified installer that:
#   - Contains both x64 and arm64 binaries
#   - Automatically installs the correct binary for the system
#   - Start menu shortcuts
#   - Optional desktop shortcut
#   - File association for .hcad files
#   - Add/Remove Programs entry
#   - Clean uninstaller

name: Windows Installer

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AUTHORS'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:
  # Callable from another workflow (a release workflow that gathers every
  # package on a tag); the triggers above stay as they are.
  workflow_call:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:

  # ================================================================
  #  Build both binaries through the reusable build workflows
  # ================================================================

  build-x64:
    name: Build (x64)
    uses: ./.github/workflows/windows-build-msvc.yml
    with:
      artifact-name: hobbycad-x64-binary

  build-arm64:
    name: Build (arm64)
    uses: ./.github/workflows/windows-build-msvc-arm64.yml
    with:
      artifact-name: hobbycad-arm64-binary

  # ================================================================
  #  Create unified installer
  # ================================================================

  installer:
    name: Create Installer
    runs-on: windows-latest
    needs: [build-x64, build-arm64]

    steps:
      - name: Checkout HobbyCAD
        uses: actions/checkout@v7

      - name: Download x64 binary
        uses: actions/download-artifact@v8
        with:
          name: hobbycad-x64-binary
          path: staging-x64

      - name: Download arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: hobbycad-arm64-binary
          path: staging-arm64

      - name: Check the downloaded builds
        shell: pwsh
        run: |
          foreach ($arch in @("x64", "arm64")) {
              $exe = "staging-$arch\bin\hobbycad.exe"
              if (-not (Test-Path $exe)) { Write-Error "hobbycad.exe missing for $arch"; exit 1 }
              Write-Host "$arch build: $exe ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"
          }

      - name: Download VC++ Redistributables
        shell: pwsh
        run: |
          # Microsoft's permalinks for the latest v14 runtime (Visual Studio 2017
          # to 2026). A program needs a runtime the same as or later than the
          # toolset that built it, and the latest satisfies whichever toolset the
          # builds picked (scripts/ci/select-msvc-toolset.ps1).
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile "staging-x64/vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.arm64.exe" -OutFile "staging-arm64/vc_redist.arm64.exe"
          Write-Host "Downloaded VC++ Redistributables for x64 and arm64"

      - name: Stage Mesa software OpenGL (optional installer component)
        shell: pwsh
        run: |
          # llvmpipe: a complete OpenGL 4.5 renderer in software, for PCs with
          # no GPU driver. Without it Windows falls back to its built-in
          # OpenGL 1.1, which OCCT survives only through a fixed-function
          # path with no sRGB stage (colors come out dark and over-saturated).
          # Offered as an unchecked installer task; it adds about 60 MB.
          # x64 only: mesa-dist-win ships no arm64 build.
          $ver = "26.2.0"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$ver/mesa3d-$ver-release-msvc.7z"
          $sha = "dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          $got = (Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { Write-Error "mesa-dist-win checksum mismatch: $got"; exit 1 }
          7z x -omesa -y mesa.7z | Out-Null
          New-Item -ItemType Directory -Force -Path staging-x64/mesa | Out-Null
          Copy-Item mesa/x64/opengl32.dll, mesa/x64/libgallium_wgl.dll, mesa/x64/dxil.dll staging-x64/mesa/
          # Mesa's license text (MIT) at the same release tag, shipped beside the DLLs
          Invoke-WebRequest -Uri "https://gitlab.freedesktop.org/mesa/mesa/-/raw/mesa-$ver/docs/license.rst" -OutFile staging-x64/mesa/MESA-LICENSE.txt
          Get-ChildItem staging-x64/mesa | Format-Table Name, Length

      - name: Get version
        id: version
        shell: pwsh
        run: |
          # project() spans several lines in CMakeLists.txt; match the VERSION line itself
          $version = Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+([0-9.]+)' |
                     Select-Object -First 1 | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not $version) { Write-Host "::warning::version not found in CMakeLists.txt; using the 0.0.0 sentinel"; $version = "0.0.0" }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"

          @"
          ; HobbyCAD Inno Setup Script
          ; Unified installer with x64 and arm64 support

          #define MyAppName "HobbyCAD"
          #define MyAppVersion "$version"
          #define MyAppPublisher "HobbyCAD Project"
          #define MyAppURL "https://github.com/ayourk/hobbycad"
          #define MyAppExeName "hobbycad.exe"

          [Setup]
          AppId={{E8F5A231-7B3C-4D5E-9F1A-2B3C4D5E6F7B}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}/issues
          AppUpdatesURL={#MyAppURL}/releases
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          AllowNoIcons=yes
          LicenseFile=LICENSE
          OutputDir=.
          OutputBaseFilename=HobbyCAD-{#MyAppVersion}-Setup
          Compression=lzma2/normal
          SolidCompression=no
          WizardStyle=modern
          ; Support both x64 and arm64
          ArchitecturesAllowed=x64compatible arm64
          ArchitecturesInstallIn64BitMode=x64compatible arm64
          UninstallDisplayIcon={app}\bin\{#MyAppExeName}
          ; The installer's own icon: the .ico the build renders from resources/icons/hobbycad.svg,
          ; installed to share/icons on Windows and staged with the binary.
          SetupIconFile=staging-x64\share\icons\hobbycad.ico
          ; Qt 6.4 needs Windows 10 1809 (build 17763) or later; refuse older
          ; systems here rather than failing at first launch.
          MinVersion=10.0.17763
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked
          ; Mesa llvmpipe, for PCs without a GPU driver (Windows falls back to OpenGL 1.1 otherwise). x64 only.
          Name: "mesa"; Description: "Install the Mesa software OpenGL renderer (for PCs without a graphics driver, about 60 MB)"; GroupDescription: "Compatibility:"; Flags: unchecked; Check: not IsArm64

          [Files]
          ; Install x64 binary on x64 systems (statically linked, no DLLs needed)
          Source: "staging-x64\bin\{#MyAppExeName}"; DestDir: "{app}\bin"; Flags: ignoreversion; Check: not IsArm64
          Source: "staging-x64\bin\hobbycad.com"; DestDir: "{app}\bin"; Flags: ignoreversion; Check: not IsArm64
          Source: "staging-x64\vc_redist.x64.exe"; DestDir: "{tmp}"; Flags: deleteafterinstall; Check: not IsArm64
          Source: "staging-x64\mesa\opengl32.dll"; DestDir: "{app}\bin"; Flags: ignoreversion; Tasks: mesa; Check: not IsArm64
          Source: "staging-x64\mesa\libgallium_wgl.dll"; DestDir: "{app}\bin"; Flags: ignoreversion; Tasks: mesa; Check: not IsArm64
          Source: "staging-x64\mesa\dxil.dll"; DestDir: "{app}\bin"; Flags: ignoreversion; Tasks: mesa; Check: not IsArm64
          Source: "staging-x64\mesa\MESA-LICENSE.txt"; DestDir: "{app}\licenses"; Flags: ignoreversion; Tasks: mesa; Check: not IsArm64

          ; Install arm64 binary on arm64 systems (statically linked, no DLLs needed)
          Source: "staging-arm64\bin\{#MyAppExeName}"; DestDir: "{app}\bin"; Flags: ignoreversion; Check: IsArm64
          Source: "staging-arm64\bin\hobbycad.com"; DestDir: "{app}\bin"; Flags: ignoreversion; Check: IsArm64
          Source: "staging-arm64\vc_redist.arm64.exe"; DestDir: "{tmp}"; Flags: deleteafterinstall; Check: IsArm64

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\bin\{#MyAppExeName}"
          Name: "{group}\{cm:UninstallProgram,{#MyAppName}}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\bin\{#MyAppExeName}"; Tasks: desktopicon

          [Registry]
          Root: HKA; Subkey: "Software\Classes\.hcad"; ValueType: string; ValueName: ""; ValueData: "HobbyCAD.Project"; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\HobbyCAD.Project"; ValueType: string; ValueName: ""; ValueData: "HobbyCAD Project"; Flags: uninsdeletekey
          Root: HKA; Subkey: "Software\Classes\HobbyCAD.Project\DefaultIcon"; ValueType: string; ValueName: ""; ValueData: "{app}\bin\{#MyAppExeName},0"
          Root: HKA; Subkey: "Software\Classes\HobbyCAD.Project\shell\open\command"; ValueType: string; ValueName: ""; ValueData: """{app}\bin\{#MyAppExeName}"" ""%1"""

          [Run]
          ; Install VC++ Redistributable (required for MSVC runtime)
          Filename: "{tmp}\vc_redist.x64.exe"; Parameters: "/quiet /norestart"; StatusMsg: "Installing Visual C++ Runtime..."; Flags: waituntilterminated; Check: not IsArm64
          Filename: "{tmp}\vc_redist.arm64.exe"; Parameters: "/quiet /norestart"; StatusMsg: "Installing Visual C++ Runtime..."; Flags: waituntilterminated; Check: IsArm64
          ; Launch application
          Filename: "{app}\bin\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent
          ; Windows on ARM has no OpenGL driver of its own; Microsoft's compatibility
          ; pack (Mesa's d3d12 driver, built for arm64) is the supported source.
          Filename: "ms-windows-store://pdp/?productid=9NQPSL29BFFF"; Description: "Open the Microsoft Store page for the OpenCL, OpenGL, and Vulkan Compatibility Pack (OpenGL on Windows on ARM)"; Flags: postinstall shellexec skipifsilent; Check: IsArm64

          ; No [Code] helper: Pascal Script is case-insensitive, so a helper
          ; named IsARM64 that returns IsArm64 calls itself and the installer
          ; spins forever at the first Check (found on the clean test VM).
          ; IsArm64 is built into Inno Setup 6.3 and later.

          [Code]
          { Windows on ARM ships no OpenGL driver; without Microsoft's compatibility
            pack Windows falls back to its OpenGL 1.1 software renderer. Say so once,
            after the task page, on arm64 only. }
          procedure InitializeWizard;
          begin
            if IsArm64 then
              CreateOutputMsgPage(wpSelectTasks,
                'OpenGL on Windows on ARM', 'HobbyCAD draws with OpenGL.',
                'Windows on ARM includes no OpenGL driver. Install Microsoft''s free ' +
                '"OpenCL, OpenGL, and Vulkan Compatibility Pack" from the Microsoft Store; ' +
                'it runs OpenGL on the GPU through Direct3D 12. Without it Windows falls ' +
                'back to its OpenGL 1.1 software renderer and HobbyCAD is slow, with wrong ' +
                'colors. The last page of this setup can open the Store page for you.');
          end;
          "@ | Out-File -FilePath "hobbycad.iss" -Encoding UTF8

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" hobbycad.iss

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: hobbycad-windows-setup
          path: "*-Setup.exe"
          retention-days: 30
          if-no-files-found: error
