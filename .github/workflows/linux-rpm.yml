# .github/workflows/linux-rpm.yml
#
# Build HobbyCAD RPM packages for RHEL-compatible and Fedora distros.
#
# Uses containers on Ubuntu runners to build native RPMs:
#   - AlmaLinux 9 (RHEL 9 compatible, 2032 EOL) - matches Ubuntu 22.04 era
#   - Fedora 40 (current stable, newer packages)
#
# Both x86_64 and aarch64 architectures are supported.

name: Linux RPM

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AUTHORS'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:
  # Callable from another workflow (a release workflow that gathers every
  # package on a tag); the triggers above stay as they are.
  workflow_call:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:

  # ================================================================
  #  RPM Build Matrix
  # ================================================================
  #
  #  Builds RPM packages using native containers.
  #  AlmaLinux 9 for enterprise/LTS users, Fedora 40 for latest.

  rpm:
    name: HobbyCAD RPM (${{ matrix.distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # AlmaLinux 9 (RHEL 9 compatible)
          - distro: almalinux9
            arch: x86_64
            runner: ubuntu-24.04
            container: almalinux:9
            artifact_name: hobbycad-almalinux9-x64
          - distro: almalinux9
            arch: aarch64
            runner: ubuntu-24.04-arm
            container: almalinux:9
            artifact_name: hobbycad-almalinux9-arm64
          # Fedora 40
          - distro: fedora40
            arch: x86_64
            runner: ubuntu-24.04
            container: fedora:40
            artifact_name: hobbycad-fedora40-x64
          - distro: fedora40
            arch: aarch64
            runner: ubuntu-24.04-arm
            container: fedora:40
            artifact_name: hobbycad-fedora40-arm64

    steps:
      - name: Install git (for checkout)
        run: |
          if command -v dnf &> /dev/null; then
            dnf install -y git
          elif command -v yum &> /dev/null; then
            yum install -y git
          fi

      - name: Checkout HobbyCAD
        uses: actions/checkout@v7

      - name: Enable EPEL and CRB (AlmaLinux 9)
        if: startsWith(matrix.distro, 'almalinux')
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb
          dnf swap -y curl-minimal curl || true

      # The build dependencies are the BuildRequires of
      # packaging/rpm/hobbycad.spec; the extras are what the scripts/ci/
      # dependency builds need beyond them.
      - name: Install build dependencies
        run: scripts/ci/install-build-deps.sh rpm --extra eigen3-devel curl xz tar patch

      # OpenCASCADE is by far the slowest dependency, so its install tree is
      # cached. The key names the image, architecture and compiler, the
      # pinned source checksum and the build script, and it is exact: an older
      # tree must never stand in for a new pin. A miss builds with its real
      # /usr/local prefix but installs through DESTDIR into /opt/occt, and
      # saves that tree at once, so a later failure in the job cannot lose it.
      # Every run then copies the tree into /usr/local.
      - name: OpenCASCADE cache key
        id: occt-key
        run: |
          . scripts/ci/pins.sh
          echo "key=occt-${{ matrix.container }}-${{ matrix.arch }}-gcc$(gcc -dumpfullversion)-${PIN_OPENCASCADE_SHA256}-${{ hashFiles('scripts/ci/build-opencascade.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore OpenCASCADE
        id: occt
        uses: actions/cache/restore@v6
        with:
          path: /opt/occt
          key: ${{ steps.occt-key.outputs.key }}

      - name: Build OpenCASCADE
        if: steps.occt.outputs.cache-hit != 'true'
        run: DESTDIR=/opt/occt scripts/ci/build-opencascade.sh

      - name: Save OpenCASCADE
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /opt/occt
          key: ${{ steps.occt-key.outputs.key }}

      - name: Install OpenCASCADE
        run: cp -a /opt/occt/usr/local/. /usr/local/

      # Every Linux package is built against the versions.json pins, from
      # checksum-verified sources, statically where the distribution ships
      # none (it ships no OpenCASCADE 8 and no libslvs).
      - name: Build pinned dependencies
        run: |
          scripts/ci/build-nlohmann-json.sh
          scripts/ci/build-libwebp.sh
          scripts/ci/build-libslvs.sh --static

          # MeshFix is not built: nothing in the package uses it (devtest
          # only probes for it), and it is the planned auto-repair backend
          # for HobbyMesh (docs/cad_library_recommendations.txt, section 14).
          # Kept commented out, not removed. Before enabling it again: pin its
          # orig in versions.json and fetch it through scripts/ci (Launchpad
          # +sourcefiles URLs disappear), carry the shared-library patch in
          # the orig, and fix the two loader memory-safety defects
          # (MarcoAttene/MeshFix-V2.1 issue #19).
          # curl -fL --retry 3 --retry-all-errors -o /tmp/meshfix.tar.gz "https://launchpad.net/~ayourk/+archive/ubuntu/hobbycad/+sourcefiles/meshfix/2.1.git~20260208-1~ppa1~noble1/meshfix_2.1.git~20260208.orig.tar.gz"
          # mkdir -p /tmp/meshfix && tar -xzf /tmp/meshfix.tar.gz -C /tmp/meshfix --strip-components=1
          # curl -fL --retry 3 --retry-all-errors -o /tmp/meshfix.debian.tar.xz "https://launchpad.net/~ayourk/+archive/ubuntu/hobbycad/+sourcefiles/meshfix/2.1.git~20260208-1~ppa1~noble1/meshfix_2.1.git~20260208-1~ppa1~noble1.debian.tar.xz"
          # tar -xJf /tmp/meshfix.debian.tar.xz -C /tmp/meshfix
          # cd /tmp/meshfix && patch -p1 < debian/patches/0001-build-shared-library.patch
          # cmake -B build -G Ninja \
          #   -DCMAKE_BUILD_TYPE=Release \
          #   -DMESHFIX_BUILD_SHARED=ON \
          #   -DMESHFIX_BUILD_CLI=OFF
          # cmake --build build
          # cmake --install build

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DPKG_CONFIG_ARGN=--static

      - name: Build
        run: cmake --build build

      - name: Create RPM package structure
        run: |
          # Install to a staging directory
          DESTDIR=$(pwd)/rpm-root cmake --install build

          # Create RPM spec file
          VERSION=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -1)
          if [ -z "$VERSION" ]; then echo "::warning::version not found in CMakeLists.txt; using the 0.0.0 sentinel"; VERSION=0.0.0; fi

          mkdir -p rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}
          cp packaging/rpm/hobbycad.spec rpmbuild/SPECS/
          cp -a rpm-root rpmbuild/BUILD/
          echo "HC_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build RPM
        run: |
          rpmbuild --define "_topdir $(pwd)/rpmbuild" \
                   --define "_builddir $(pwd)/rpmbuild/BUILD" \
                   --define "hc_version ${HC_VERSION}" \
                   -bb rpmbuild/SPECS/hobbycad.spec

          # Move RPM to workspace root for upload
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} . \;

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-rpm
          path: "*.rpm"
          retention-days: 30
          if-no-files-found: error
