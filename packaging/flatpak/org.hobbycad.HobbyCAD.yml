app-id: org.hobbycad.HobbyCAD
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: hobbycad
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  # OpenCASCADE 8.0.1 with the HobbyCAD +p1 series, the PPA's orig tarball
  # (a release asset of ayourk/hobbycad-vcpkg), the same source every
  # other channel builds against.
  - name: opencascade
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_LIBRARY_TYPE=Shared
      - -DBUILD_MODULE_Draw=OFF
      - -DBUILD_MODULE_Visualization=ON
      - -DBUILD_MODULE_ApplicationFramework=ON
      - -DBUILD_MODULE_DataExchange=ON
      - -DUSE_TBB=OFF
      - -DUSE_FREETYPE=ON
      - -DUSE_VTK=OFF
    sources:
      - type: archive
        url: https://github.com/ayourk/hobbycad-vcpkg/releases/download/sources/opencascade_8.0.1+p1.orig.tar.xz
        sha256: 966a79fb0fbed4f947b6a3cc456eed61dd584f8a165869afa9f9d232f275172e

  # libslvs (SolveSpace constraint solver library). The PPA's orig tarball,
  # published as a release asset of ayourk/hobbycad-vcpkg because Launchpad
  # drops superseded source files; the HobbyCAD series (3.2p1) is baked in.
  - name: libslvs
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_LIB=ON
      - -DENABLE_GUI=OFF
      - -DENABLE_CLI=OFF
      - -DENABLE_OPENMP=OFF
      - -DENABLE_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/ayourk/hobbycad-vcpkg/releases/download/sources/libslvs_3.2.git.20260914+p1.orig.tar.gz
        sha256: c6ccc639b43113733b39d7adaa0d0b05061194fcb0abc22abf758b08a6f42a98
      - type: archive
        url: https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
        sha256: 8586084f71f9bde545ee7fa6d00288b264a2b7ac3607b974e54d13e7162c1c72
        dest: extlib/eigen
      - type: shell
        commands:
          - for submod in zlib libpng freetype cairo pixman angle; do mkdir -p extlib/$submod && echo "# stub" > extlib/$submod/CMakeLists.txt; done
          - sed -i 's/set(CMAKE_CXX_STANDARD 11)/set(CMAKE_CXX_STANDARD 14)/' CMakeLists.txt

  # libwebp, the pinned version, so the WebP path is the same as every
  # other channel's rather than the runtime's copy.
  - name: libwebp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DWEBP_BUILD_ANIM_UTILS=OFF
      - -DWEBP_BUILD_CWEBP=OFF
      - -DWEBP_BUILD_DWEBP=OFF
      - -DWEBP_BUILD_GIF2WEBP=OFF
      - -DWEBP_BUILD_IMG2WEBP=OFF
      - -DWEBP_BUILD_VWEBP=OFF
      - -DWEBP_BUILD_WEBPINFO=OFF
      - -DWEBP_BUILD_WEBPMUX=OFF
      - -DWEBP_BUILD_EXTRAS=OFF
    sources:
      - type: archive
        url: https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0.tar.gz
        sha256: e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564

  # nlohmann_json (header-only JSON library)
  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DJSON_BuildTests=OFF
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/archive/refs/tags/v3.12.0.tar.gz
        sha256: 4b92eb0c06d10683f7447ce9406cb97cd4b453be18d7279320f7b2f025c10187

  # MeshFix is not built: nothing in HobbyCAD uses it (devtest only probes
  # for it), and it is the planned auto-repair backend for HobbyMesh
  # (docs/cad_library_recommendations.txt, section 14). Kept commented out,
  # not removed. Before enabling it again: carry the shared-library patch in
  # the orig (the patch archive below is a Launchpad +sourcefiles URL, which
  # disappears) and fix the two loader memory-safety defects
  # (MarcoAttene/MeshFix-V2.1 issue #19).
  # - name: meshfix
  #   buildsystem: cmake-ninja
  #   config-opts:
  #     - -DCMAKE_BUILD_TYPE=Release
  #     - -DMESHFIX_BUILD_SHARED=ON
  #     - -DMESHFIX_BUILD_CLI=OFF
  #   sources:
  #     - type: archive
  #       url: https://github.com/ayourk/hobbycad-vcpkg/releases/download/sources/meshfix_2.1.git.20260208.orig.tar.gz
  #       sha256: 27d135e85e320439df49d96c8de79042d2cbb524f9aa952eb7a8544571131fbf
  #     - type: archive
  #       url: https://launchpad.net/~ayourk/+archive/ubuntu/hobbycad/+sourcefiles/meshfix/2.1.git~20260208-1~ppa1~noble1/meshfix_2.1.git~20260208-1~ppa1~noble1.debian.tar.xz
  #       sha256: cbb3b70289d24c817d55f4cbcdf9a72b20038fe4a88cd711394042a669705a32
  #       dest: debian-patches
  #     - type: shell
  #       commands:
  #         - patch -p1 < debian-patches/patches/0001-build-shared-library.patch

  # HobbyCAD
  - name: hobbycad
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: .
